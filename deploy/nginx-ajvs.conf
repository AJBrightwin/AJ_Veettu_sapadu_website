# /etc/nginx/sites-available/ajvs
# Replace ajveettusaapadu.com with your domain. Certbot adds the HTTPS part automatically.
server {
    listen 80;
    server_name ajveettusaapadu.com www.ajveettusaapadu.com;
    client_max_body_size 10M;

    # frontend files (CSS, JS, images) after "collectstatic"
    location /static/ {
        alias /var/www/ajvs/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    # dish & banner photos uploaded from the admin panel
    location /media/ {
        alias /var/www/ajvs/backend/media/;
        expires 7d;
        access_log off;
    }
    location = /favicon.ico { alias /var/www/ajvs/backend/staticfiles/favicon/favicon.ico; access_log off; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # everything else goes to Django
    location / {
        proxy_pass http://unix:/run/ajvs/ajvs.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
